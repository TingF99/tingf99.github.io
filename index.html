<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><span class="restaurant-name"></span> 候位系統</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f9; padding: 20px; max-width: 400px; margin: 0 auto; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, select { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .hidden { display: none; }
        .danger { background: #dc3545; margin-top: 15px; }
        .danger:hover { background: #c82333; }
        #status-card h1 { font-size: 48px; margin: 10px 0; color: #007bff; }
    </style>
</head>
<body>
    <h2 class="restaurant-name"></h2>

    <!-- 填寫資料區 -->
    <div id="join-card" class="card">
        <h3>填寫候位資料</h3>
        <input type="text" id="name" placeholder="您的姓名 (必填)" required>
        <select id="gender">
            <option value="先生">先生</option>
            <option value="小姐">小姐</option>
        </select>
        <input type="email" id="email" placeholder="Email (接收通知用)" required>
        <input type="number" id="party_size" placeholder="用餐人數" min="1" required>
        <button onclick="joinQueue()">確認取號</button>
    </div>

    <!-- 狀態顯示區 -->
    <div id="status-card" class="card hidden">
        <h3>您的候位號碼</h3>
        <h1 id="my-id">--</h1>
        <p>目前狀態：<strong id="my-status">等候中</strong></p>
        <p>您前面還有 <strong id="ahead-count" style="font-size: 24px; color: red;">--</strong> 組</p>
        <button class="danger" onclick="leaveQueue()">取消候位</button>
    </div>

    <script src="app.js"></script>
    <script>
        let myId = localStorage.getItem('waitlist_id');
        let pollingInterval = null;

        if (myId) showStatusMode();

        async function joinQueue() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            if (!name || !email) return alert("請填寫姓名與 Email");

            const data = {
                action: 'join',
                name: name,
                gender: document.getElementById('gender').value,
                email: email,
                party_size: document.getElementById('party_size').value
            };
            const res = await postData(data);
            if (res.error) return alert(res.error);
            
            myId = res.id;
            localStorage.setItem('waitlist_id', myId);
            showStatusMode();
            updateStatus();
        }

        function showStatusMode() {
            document.getElementById('join-card').classList.add('hidden');
            document.getElementById('status-card').classList.remove('hidden');
            document.getElementById('my-id').innerText = myId;
            pollingInterval = setInterval(updateStatus, 5000); // 每 5 秒更新
        }

        async function updateStatus() {
            const res = await fetch(`${API_URL}?action=status&id=${myId}`).then(r => r.json());
            if (res.error) {
                alert("您的候位已結束 (可能已入座或取消)");
                localStorage.removeItem('waitlist_id');
                location.reload();
            } else {
                document.getElementById('ahead-count').innerText = res.ahead;
                document.getElementById('my-status').innerText = res.status === 'notified' ? '⚠️ 已發送通知，請盡速報到' : '等候中';
            }
        }

        async function leaveQueue() {
            if (!confirm("確定要取消候位嗎？")) return;
            await postData({ action: 'leave', id: myId });
            localStorage.removeItem('waitlist_id');
            location.reload();
        }
    </script>
</body>
</html>
