<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>員工後台 - <span class="restaurant-name"></span></title>
    <link rel="stylesheet" href="waitlist.css">
    <style>
        body { max-width: 800px; } /* 員工頁面寬一點 */
    </style>
</head>
<body>
    <div class="card">
        <h2>🧑‍🍳 員工管理後台</h2>
        
        <div id="login-section">
            <input type="password" id="staff-pwd" placeholder="請輸入員工密碼 ">
            <button onclick="login()">登入</button>
        </div>

        <div id="dashboard" class="hidden">
            <button onclick="loadQueue()" style="background: #17a2b8; margin-bottom: 15px;">重新整理列表</button>
            <table>
                <thead>
                    <tr>
                        <th>號碼</th><th>姓名</th><th>人數</th><th>時間</th><th>狀態</th><th>操作</th>
                    </tr>
                </thead>
                <tbody id="queue-body"></tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        let staffKey = "";

        async function login() {
            staffKey = document.getElementById('staff-pwd').value;
            const res = await fetch(`${API_URL}?action=queue&key=${staffKey}`).then(r => r.json());
            if (res.error) {
                alert("密碼錯誤！");
            } else {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                renderQueue(res.queue);
            }
        }

        async function loadQueue() {
            const res = await fetch(`${API_URL}?action=queue&key=${staffKey}`).then(r => r.json());
            if (!res.error) renderQueue(res.queue);
        }

        function renderQueue(queue) {
            const tbody = document.getElementById('queue-body');
            tbody.innerHTML = '';
            
            const activeQueue = queue.filter(item => item.status === 'waiting' || item.status === 'notified');
            
            if (activeQueue.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6">目前無人候位</td></tr>';
                return;
            }

            activeQueue.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${item.id}</b></td>
                    <td>${item.name} ${item.gender}</td>
                    <td>${item.party_size} 人</td>
                    <td>${item.created_at.split(' ')[1]}</td>
                    <td style="${item.status === 'notified' ? 'color: red; font-weight: bold;' : ''}">
                        ${item.status === 'notified' ? '⚠️已通知' : '等候中'}
                    </td>
                    <td>
                        <button class="btn-notify" onclick="operate('notify', ${item.id})">通知</button>
                        <button class="btn-seat" onclick="operate('seat', ${item.id})">入座</button>
                        <button class="btn-cancel" onclick="operate('cancel', ${item.id})">取消</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function operate(action, id) {
            const res = await postData({ action: action, key: staffKey, id: id });
            if (res.error) {
                alert(res.error);
            } else {
                if (action === 'notify') alert("已成功寄送 Email 通知！");
                loadQueue();
            }
        }
    </script>
</body>
</html>
