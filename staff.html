<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>員工後台 - <span class="restaurant-name"></span></title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eee; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; max-width: 800px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; border: 1px solid #ccc; text-align: center; }
        th { background: #007bff; color: white; }
        button { padding: 6px 12px; margin: 2px; border: none; border-radius: 4px; cursor: pointer; color: white; }
        .btn-notify { background: #ffc107; color: black; }
        .btn-seat { background: #28a745; }
        .btn-cancel { background: #dc3545; }
        #login-section { text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🧑‍🍳 員工管理後台</h2>
        
        <div id="login-section">
            <input type="password" id="staff-pwd" placeholder="請輸入員工密碼" style="padding: 10px;">
            <button onclick="login()" style="background: #007bff; padding: 10px;">登入</button>
        </div>

        <div id="dashboard" style="display: none;">
            <button onclick="loadQueue()" style="background: #17a2b8; padding: 8px;">重新整理</button>
            <table>
                <thead>
                    <tr>
                        <th>號碼</th><th>姓名</th><th>人數</th><th>時間</th><th>狀態</th><th>操作</th>
                    </tr>
                </thead>
                <tbody id="queue-body"></tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        let staffKey = "";

        async function login() {
            staffKey = document.getElementById('staff-pwd').value;
            const res = await fetch(`${API_URL}?action=queue&key=${staffKey}`).then(r => r.json());
            if (res.error) {
                alert("密碼錯誤！");
            } else {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                renderQueue(res.queue);
            }
        }

        async function loadQueue() {
            const res = await fetch(`${API_URL}?action=queue&key=${staffKey}`).then(r => r.json());
            if (!res.error) renderQueue(res.queue);
        }

        function renderQueue(queue) {
            const tbody = document.getElementById('queue-body');
            tbody.innerHTML = '';
            // 只顯示還在排隊或已通知的
            const activeQueue = queue.filter(item => item.status === 'waiting' || item.status === 'notified');
            
            activeQueue.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${item.id}</b></td>
                    <td>${item.name} ${item.gender}</td>
                    <td>${item.party_size} 人</td>
                    <td>${item.created_at.split(' ')[1]}</td>
                    <td>${item.status === 'notified' ? '⚠️已通知' : '等候中'}</td>
                    <td>
                        <button class="btn-notify" onclick="operate('notify', ${item.id})">通知</button>
                        <button class="btn-seat" onclick="operate('seat', ${item.id})">入座</button>
                        <button class="btn-cancel" onclick="operate('cancel', ${item.id})">取消</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function operate(action, id) {
            const res = await postData({ action: action, key: staffKey, id: id });
            if (res.error) alert(res.error);
            else loadQueue();
        }
    </script>
</body>
</html>
